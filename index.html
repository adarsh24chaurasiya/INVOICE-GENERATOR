<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoicely — Invoice Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<header class="topbar">
  <div class="logo">
    <span class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
    </span>
    Invoicely
  </div>
</header>

<main class="layout">

  <section id="formSection" class="form-col">

    <div id="editNotice" class="edit-notice hidden">
      Editing invoice <b id="editNoticeNumber"></b>
      <button id="cancelEditBtn">Cancel</button>
    </div>

    <div class="section">
      <div class="section-title"><span class="num-badge">1</span>Business</div>
      <div class="field"><label>Business name<span class="req">*</span></label><input type="text" id="fromName" placeholder="Acme Studio"></div>
      <div class="field"><label>Address &amp; contact<span class="req">*</span></label><textarea id="fromInfo" placeholder="123 Market St, San Francisco, CA&#10;hello@acme.com"></textarea></div>
      <div class="grid two">
        <div class="field"><label>GSTIN <em>optional</em></label><input type="text" id="gstin" placeholder="22AAAAA0000A1Z5"></div>
        <div class="field"><label>Udyam reg. no. <em>optional</em></label><input type="text" id="udyam" placeholder="UDYAM-XX-00-0000000"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span class="num-badge">2</span>Client</div>
      <div class="field"><label>Client name<span class="req">*</span></label><input type="text" id="toName" placeholder="Client Name"></div>
      <div class="field"><label>Address &amp; contact<span class="req">*</span></label><textarea id="toInfo" placeholder="456 Client Ave, New York, NY&#10;client@email.com"></textarea></div>
    </div>

    <div class="section">
      <div class="section-title"><span class="num-badge">3</span>Details</div>
      <div class="grid three">
        <div class="field"><label>Invoice #<span class="req">*</span></label><input type="text" id="invoiceNumber" placeholder="INV-0001"></div>
        <div class="field"><label>Date<span class="req">*</span></label><input type="date" id="invoiceDate"></div>
        <div class="field"><label>Due date<span class="req">*</span></label><input type="date" id="dueDate"></div>
      </div>
      <div class="grid two">
        <div class="field">
          <label>Currency</label>
          <select id="currency">
            <option value="$">USD $</option>
            <option value="€">EUR €</option>
            <option value="£">GBP £</option>
            <option value="₹">INR ₹</option>
            <option value="¥">JPY ¥</option>
          </select>
        </div>
        <div class="field"><label>Tax rate (%)</label><input type="number" id="taxRate" value="0" min="0" step="0.01"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span class="num-badge">4</span>Items</div>
      <div class="items-list" id="itemsBody"></div>
      <button id="addItemBtn" class="btn-outline">+ Add item</button>
    </div>

    <div class="section">
      <div class="section-title"><span class="num-badge">5</span>Notes &amp; Payment</div>
      <div class="field"><label>Notes</label><textarea id="notes" placeholder="Payment terms, thank-you note…"></textarea></div>
      <div class="field"><label>Bank name <em>optional</em></label><input type="text" id="bankName" placeholder="Bank name"></div>
      <div class="grid two">
        <div class="field"><label>Account number<span class="req">*</span></label><input type="text" id="accountNumber" placeholder="e.g. 123456789012"></div>
        <div class="field"><label>IFSC code<span class="req">*</span></label><input type="text" id="ifscCode" placeholder="e.g. SBIN0001234"></div>
      </div>
    </div>

    <button id="generateBtn" class="btn-gradient generate-btn">
      Generate Invoice
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </button>

  </section>

  <section class="invoices-col">
    <div class="invoices-heading" id="invoicesHeading">
      <h2>Your Invoices</h2>
      <span id="invoiceCount" class="count-pill">0</span>
    </div>
    <div id="emptyState" class="empty-state">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
      <p>No invoices generated yet</p>
    </div>
    <div id="invoiceList" class="invoice-list"></div>
  </section>

</main>

<button id="backToFormBtn" class="fab">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
  New Invoice
</button>

<div class="toast" id="toast">PDF downloaded</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
